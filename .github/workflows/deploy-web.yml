# Builds the website and publishes it to the lfg-tenziki Cloudflare Pages
# project (https://lfg.tenziki.com), including the link-preview function.
#
# Needs two repository secrets, the same kind tenziki-com uses:
#   CLOUDFLARE_API_TOKEN   a token with "Cloudflare Pages: Edit" on the account
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID
# and the repository variables VITE_SUPABASE_URL, VITE_SUPABASE_KEY,
# VITE_SITE_URL and VITE_VAPID_PUBLIC_KEY. Without the token it skips.
name: Deploy website

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'android/**', 'ios/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://lfg.tenziki.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_KEY: ${{ vars.VITE_SUPABASE_KEY }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
    steps:
      - name: Skip when no Cloudflare token is configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "CLOUDFLARE_API_TOKEN is not set; skipping the deploy."
      - uses: actions/checkout@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
      - uses: actions/setup-node@v4
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
      - run: npm run build
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
      - name: Publish to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler@4 pages deploy dist --project-name lfg-tenziki --branch main --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_SHA"
