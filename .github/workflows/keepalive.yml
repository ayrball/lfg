# Free Supabase projects pause after 7 days without activity. This pings the
# database every 3 days so the app never goes to sleep.
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → add
#   SUPABASE_URL  (e.g. https://abcd1234.supabase.co)
#   SUPABASE_KEY  (the anon / publishable key — the same one the app uses)
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_KEY secrets are not set — skipping."
            exit 0
          fi
          curl -fsS "$SUPABASE_URL/rest/v1/rpc/get_public_game" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_id":"00000000-0000-0000-0000-000000000000"}'
          echo
          echo "Supabase is awake."
